apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app
  labels:
    app: node-app
spec:
  # Number of Pod replicas to keep running
  replicas: 3
  # Match Pods with this label
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers:
        - name: node-app
          # Replace with your Docker Hub username or registry path
          image: <your-dockerhub-username>/node-app:latest
          # Always pull the latest image from the registry
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          # Inject environment variables from the ConfigMap
          envFrom:
            - configMapRef:
                name: node-app-config
          # Liveness probe — restart container if it becomes unresponsive
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          # Readiness probe — only send traffic when the container is ready
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          # Resource requests and limits
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
